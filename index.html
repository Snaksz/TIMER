<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Static Timer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Static Timer</h1>
      <p class="subtitle">A simple countdown timer that runs in your browser.</p>

      <form id="timer-form" class="controls">
        <label for="minutes">Minutes</label>
        <input id="minutes" name="minutes" type="number" min="0" max="999" value="5" />

        <label for="seconds">Seconds</label>
        <input id="seconds" name="seconds" type="number" min="0" max="59" value="0" />

        <div class="buttons">
          <button type="submit" id="start">Start</button>
          <button type="button" id="pause" disabled>Pause</button>
          <button type="button" id="reset">Reset</button>
        </div>
      </form>

      <div id="display" class="display" aria-live="polite">05:00</div>
      <p id="status" class="status">Ready.</p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
